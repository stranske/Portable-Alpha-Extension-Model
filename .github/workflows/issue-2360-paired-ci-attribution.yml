# Issue #2360 paired CI attribution workflow
# Runs historical configured test suite at two exact commits with branch coverage enabled
# to establish comparable statement-plus-branch coverage boundaries for issue #2360.
#
# This workflow:
# 1. Creates isolated checkouts at the two historical SHAs
# 2. Verifies checkout SHAs and pyproject.toml configuration hashes
# 3. Executes pytest with --cov --cov-branch and JSON output
# 4. Uploads raw coverage JSON and terminal receipts as artifacts
#
# Historical SHAs:
#   Parent (squash parent): 10ac6839518576d4dc5199a24392eadfc388c713
#   Merge (PR #2372):       e8967edb2aa1bdbc1a68ea58ed241cf205915d03
#
# Configuration hash (both commits): b442a73dc1a9c83e895e6613a07f56d2604799da127ce14edee20adaf55d06d4
#
# Command executed at each checkout:
#   pytest tests/ -m 'not live_llm' --cov --cov-config=pyproject.toml --cov-branch \
#     --cov-report=json:coverage.json --cov-report=term-missing -n auto --dist=loadgroup
#
# Expected selection: includes slow tests, excludes live_llm
# Expected test counts: 1716 passed, 2 skipped (parent); 1724 passed, 2 skipped (merge)
# Target: about 60 fewer uncovered statement-plus-branch units

name: Issue #2360 Paired CI Attribution

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run - do not upload artifacts'
        required: false
        default: 'false'
  push:
    branches: [codex/issue-2474]
    paths:
      - '.github/workflows/issue-2360-paired-ci-attribution.yml'
      - 'docs/evidence/issue-2360-closer-repair/**'

jobs:
  paired-ci-attribution:
    name: Paired CI Attribution (Issue #2360)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        revision:
          - sha: 10ac6839518576d4dc5199a24392eadfc388c713
            name: parent
            label: configured-parent
          - sha: e8967edb2aa1bdbc1a68ea58ed241cf205915d03
            name: merge
            label: configured-merge
    
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-xdist

      - name: Create isolated checkout at ${{ matrix.revision.sha }}
        id: checkout
        run: |
          # Create a temporary directory for the isolated checkout
          mkdir -p /tmp/issue2360-${{ matrix.revision.name }}
          
          # Checkout the exact revision
          git clone --no-local --no-tags --single-branch . /tmp/issue2360-${{ matrix.revision.name }}
          cd /tmp/issue2360-${{ matrix.revision.name }}
          git checkout ${{ matrix.revision.sha }}
          
          # Verify the checkout SHA
          ACTUAL_SHA=$(git rev-parse HEAD)
          if [ "$ACTUAL_SHA" != "${{ matrix.revision.sha }}" ]; then
            echo "SHA mismatch: expected ${{ matrix.revision.sha }}, got $ACTUAL_SHA"
            exit 1
          fi
          
          # Verify pyproject.toml configuration hash
          CONFIG_HASH=$(python -c "import hashlib, pathlib; print(hashlib.sha256(pathlib.Path('pyproject.toml').read_bytes()).hexdigest())")
          EXPECTED_CONFIG_HASH="b442a73dc1a9c83e895e6613a07f56d2604799da127ce14edee20adaf55d06d4"
          if [ "$CONFIG_HASH" != "$EXPECTED_CONFIG_HASH" ]; then
            echo "Config hash mismatch: expected $EXPECTED_CONFIG_HASH, got $CONFIG_HASH"
            exit 1
          fi
          
          echo "verified_sha=$ACTUAL_SHA" >> $GITHUB_OUTPUT
          echo "verified_config_hash=$CONFIG_HASH" >> $GITHUB_OUTPUT

      - name: Execute historical configured test suite
        id: test
        working-directory: /tmp/issue2360-${{ matrix.revision.name }}
        run: |
          # Run pytest with branch coverage enabled
          # This overrides the branch=false in pyproject.toml
          TEST_COMMAND="pytest tests/ -m 'not live_llm' --cov --cov-config=pyproject.toml --cov-branch --cov-report=json:coverage.json --cov-report=term-missing -n auto --dist=loadgroup"
          
          echo "Executing: $TEST_COMMAND"
          echo "start_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          
          # Capture terminal output
          $TEST_COMMAND 2>&1 | tee terminal-output.txt
          
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          
          # Capture environment info
          echo "python_version=$(python --version 2>&1)" >> $GITHUB_OUTPUT
          echo "pytest_version=$(python -m pytest --version 2>&1 | head -1)" >> $GITHUB_OUTPUT
          echo "pytest_cov_version=$(python -m pytest_cov --version 2>&1 | head -1)" >> $GITHUB_OUTPUT
          echo "platform=$(uname -s -m)" >> $GITHUB_OUTPUT
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "Test execution failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi

      - name: Verify coverage JSON was produced
        id: coverage
        working-directory: /tmp/issue2360-${{ matrix.revision.name }}
        run: |
          if [ ! -f coverage.json ]; then
            echo "coverage.json not found"
            exit 1
          fi
          
          # Verify it's valid JSON
          python -c "import json; json.load(open('coverage.json'))"
          
          # Capture file info
          COVERAGE_SIZE=$(stat -c%s coverage.json)
          COVERAGE_MTIME=$(stat -c%Y coverage.json)
          echo "coverage_size=$COVERAGE_SIZE" >> $GITHUB_OUTPUT
          echo "coverage_mtime=$COVERAGE_MTIME" >> $GITHUB_OUTPUT

      - name: Package receipts
        id: package
        run: |
          cd /tmp/issue2360-${{ matrix.revision.name }}
          
          # Create receipts directory
          mkdir -p receipts
          
          # Save metadata
          cat > receipts/metadata.json << EOF
          {
            "revision": "${{ matrix.revision.sha }}",
            "label": "${{ matrix.revision.label }}",
            "name": "${{ matrix.revision.name }}",
            "verified_sha": "${{ steps.checkout.outputs.verified_sha }}",
            "config_hash": "${{ steps.checkout.outputs.verified_config_hash }}",
            "exit_code": ${{ steps.test.outputs.exit_code }},
            "command": "pytest tests/ -m 'not live_llm' --cov --cov-config=pyproject.toml --cov-branch --cov-report=json:coverage.json --cov-report=term-missing -n auto --dist=loadgroup",
            "start_time": "${{ steps.test.outputs.start_time }}",
            "python_version": "${{ steps.test.outputs.python_version }}",
            "pytest_version": "${{ steps.test.outputs.pytest_version }}",
            "pytest_cov_version": "${{ steps.test.outputs.pytest_cov_version }}",
            "platform": "${{ steps.test.outputs.platform }}"
          }
          EOF
          
          # Copy coverage file
          cp coverage.json receipts/
          cp terminal-output.txt receipts/
          
          # Create artifact
          tar czf /tmp/${{ matrix.revision.label }}-receipts.tar.gz receipts/
          
          echo "artifact=/tmp/${{ matrix.revision.label }}-receipts.tar.gz" >> $GITHUB_OUTPUT

      - name: Upload receipts artifact
        if: steps.package.outcome == 'success' && inputs.dry_run != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: issue-2360-${{ matrix.revision.label }}-receipts
          path: /tmp/${{ matrix.revision.label }}-receipts.tar.gz
          compression-level: 0  # Already compressed
          retention-days: 90

  summarize:
    name: Summarize Paired CI Results
    needs: paired-ci-attribution
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Download all receipts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts
          merge-multiple: false

      - name: List artifacts
        run: |
          find /tmp/artifacts -type f -name "*.tar.gz" -exec echo "Found: {}" \;

      - name: Extract and compare
        id: compare
        run: |
          mkdir -p /tmp/comparison
          
          for artifact in /tmp/artifacts/*/*.tar.gz; do
            if [ -f "$artifact" ]; then
              dir=$(basename $(dirname "$artifact"))
              mkdir -p /tmp/comparison/$dir
              tar xzf "$artifact" -C /tmp/comparison/$dir
            fi
          done
          
          # List what we have
          find /tmp/comparison -type f | sort

      - name: Display summary
        run: |
          echo "## Issue #2360 Paired CI Attribution Summary"
          echo ""
          echo "Workflow: ${{ github.workflow }}"
          echo "Run: ${{ github.run_id }}"
          echo ""
          
          for matrix in ${{ needs.paired-ci-attribution.result }}; do
            echo "Matrix result: $matrix"
          done
          
          echo ""
          echo "Receipts uploaded as artifacts. To commit to repository:"
          echo "1. Download artifacts from this workflow run"
          echo "2. Extract and verify receipts"
          echo "3. Copy to docs/evidence/issue-2360-closer-repair/recheck/"
          echo "4. Update coverage-comparison.json"
          echo "5. Commit and push"
